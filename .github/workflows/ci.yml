name: FleetFlow CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
      - 'feat/**'
      - 'bugfix/**'
      - 'qa/**'
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =========================================================================
  # STAGE 1: BACKEND BUILD
  # Compiles solution, restores dependencies, ensures zero compile warnings/errors
  # =========================================================================
  backend-build:
    name: "Backend : Build & Package"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK 10.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet Packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore Backend Dependencies
        run: dotnet restore FleetFlow.sln

      - name: Compile Backend Solution (Release)
        run: dotnet build FleetFlow.sln --no-restore --configuration Release

      - name: Publish IdentityService Artifacts
        run: dotnet publish src/backend/services/IdentityService/IdentityService.Api/IdentityService.Api.csproj --configuration Release --no-build --output ./artifacts/identity-service

      - name: Publish FleetService Artifacts
        run: dotnet publish src/backend/services/FleetService/FleetService.Api/FleetService.Api.csproj --configuration Release --no-build --output ./artifacts/fleet-service

      - name: Upload Backend Service Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: backend-binaries
          path: ./artifacts
          retention-days: 7

  # =========================================================================
  # STAGE 2: BACKEND TEST
  # Runs unit & integration test suites, isolates test failures from compilation
  # =========================================================================
  backend-test:
    name: "Backend : Automated Tests"
    runs-on: ubuntu-latest
    needs: backend-build
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK 10.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet Packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore Backend Dependencies
        run: dotnet restore FleetFlow.sln

      - name: Run Backend Tests with TRX Logger
        run: |
          mkdir -p TestResults
          dotnet test FleetFlow.sln --configuration Release --logger "trx;LogFileName=backend-test-results.trx" --results-directory ./TestResults

      - name: Upload Test Results Report (TRX)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: ./TestResults
          retention-days: 14

  # =========================================================================
  # STAGE 3: FRONTEND LINT
  # Enforces static code quality and syntax rules
  # =========================================================================
  frontend-lint:
    name: "Frontend : Lint & Code Quality"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'
          cache-dependency-path: 'src/frontend/package-lock.json'

      - name: Install Frontend Dependencies
        working-directory: src/frontend
        run: npm ci

      - name: Execute ESLint
        working-directory: src/frontend
        run: npm run lint

  # =========================================================================
  # STAGE 4: FRONTEND TEST
  # Runs client test suite (Node test runner + jsdom)
  # =========================================================================
  frontend-test:
    name: "Frontend : Automated Tests"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'
          cache-dependency-path: 'src/frontend/package-lock.json'

      - name: Install Frontend Dependencies
        working-directory: src/frontend
        run: npm ci

      - name: Run Frontend Tests
        working-directory: src/frontend
        run: npm test -- --run

  # =========================================================================
  # STAGE 5: FRONTEND BUILD
  # Generates production bundle with Vite, depends on lint & test passes
  # =========================================================================
  frontend-build:
    name: "Frontend : Production Build"
    runs-on: ubuntu-latest
    needs: [frontend-lint, frontend-test]
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'
          cache-dependency-path: 'src/frontend/package-lock.json'

      - name: Install Frontend Dependencies
        working-directory: src/frontend
        run: npm ci

      - name: Build Vite Production Assets
        working-directory: src/frontend
        run: npm run build

      - name: Upload Frontend Production Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: src/frontend/dist
          retention-days: 7

  # =========================================================================
  # STAGE 6: CI QUALITY GATE / VERIFICATION
  # Aggregates build & test status from backend and frontend stages
  # =========================================================================
  ci-quality-gate:
    name: "CI : Quality Gate Validation"
    runs-on: ubuntu-latest
    needs: [backend-build, backend-test, frontend-lint, frontend-test, frontend-build]
    steps:
      - name: Verification Summary
        run: |
          echo "========================================================"
          echo " ALL QUALITY GATES PASSED SUCCESSFULLY!"
          echo " - Backend Build & Publish    : SUCCESS"
          echo " - Backend Unit Tests (xUnit) : SUCCESS"
          echo " - Frontend Lint (ESLint)     : SUCCESS"
          echo " - Frontend Tests (Node test) : SUCCESS"
          echo " - Frontend Production Build  : SUCCESS"
          echo " Pipeline is ready for deployment / merge."
          echo "========================================================"