name: FleetFlow CI Pipeline

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop, main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore Dependencies
      run: dotnet restore FleetFlow.sln

    - name: Build Solution
      run: dotnet build FleetFlow.sln --no-restore -c Release

    - name: Run xUnit Unit Tests
      run: dotnet test FleetFlow.sln --no-build -c Release --logger "trx;LogFileName=test-results.trx"