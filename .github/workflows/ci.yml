name: FleetFlow CI

on:
  push:
    branches:
      - main
      - develop
      - sanjeev-foundation
  pull_request:
    branches:
      - main
      - develop

jobs:
  backend-build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore Dependencies
        run: dotnet restore src/backend/FleetFlow.sln

      - name: Build Backend
        run: dotnet build src/backend/FleetFlow.sln --no-restore --configuration Release

      - name: Run Tests
        run: dotnet test src/backend/FleetFlow.sln --no-build --configuration Release --logger "trx;LogFileName=test-results.trx"

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Install Dependencies
        run: npm ci
        working-directory: src/frontend

      - name: Build Frontend
        run: npm run build
        working-directory: src/frontend