name: FleetFlow CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
      - 'feat/**'
      - 'bugfix/**'
      - 'qa/**'
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =========================================================================
  # STAGE 1: BACKEND BUILD
  # Compiles solution, restores dependencies, ensures zero compile warnings/errors
  # =========================================================================
  backend-build:
    name: "Backend : Build & Package"
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v5

      - name: Setup .NET SDK 10.0
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet Packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore Backend Dependencies
        run: dotnet restore FleetFlow.sln

      - name: Compile Backend Solution (Release)
        run: dotnet build FleetFlow.sln --no-restore --configuration Release

      - name: Publish IdentityService Artifacts
        run: dotnet publish src/backend/services/IdentityService/IdentityService.Api/IdentityService.Api.csproj --configuration Release --no-restore --output ./artifacts/identity-service

      - name: Publish FleetService Artifacts
        run: dotnet publish src/backend/services/FleetService/FleetService.Api/FleetService.Api.csproj --configuration Release --no-restore --output ./artifacts/fleet-service

      - name: Publish RentalService Artifacts
        run: dotnet publish src/backend/services/RentalService/RentalService.Api/RentalService.Api.csproj --configuration Release --no-restore --output ./artifacts/rental-service

      - name: Publish NotificationService Artifacts
        run: dotnet publish src/backend/services/NotificationService/NotificationService.Api/NotificationService.Api.csproj --configuration Release --no-restore --output ./artifacts/notification-service

      - name: Publish Guarded Database Tool
        run: dotnet publish tools/ServiceDatabaseTool/ServiceDatabaseTool.csproj --configuration Release --no-restore --output ./artifacts/database-tool

      - name: Publish Notification Migration Tool
        run: dotnet publish tools/NotificationMigration/NotificationMigration.csproj --configuration Release --no-restore --output ./artifacts/notification-migration

      - name: Publish Rental Migration Tool
        run: dotnet publish tools/RentalMigration/RentalMigration.csproj --configuration Release --no-restore --output ./artifacts/rental-migration

      - name: Upload Backend Service Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: backend-binaries
          path: ./artifacts
          retention-days: 7

  # =========================================================================
  # STAGE 2: BACKEND TEST
  # Runs unit & integration test suites, isolates test failures from compilation
  # =========================================================================
  backend-test:
    name: "Backend : Automated Tests"
    runs-on: ubuntu-24.04
    needs: backend-build
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: foundation_ci_only
          POSTGRES_DB: fleetflow_hardening_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d fleetflow_hardening_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
      kafka:
        image: apache/kafka:3.7.0
        env:
          KAFKA_NODE_ID: '1'
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: '1'
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: '1'
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: '1'
          KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: '0'
        ports:
          - 9092:9092
        options: >-
          --health-cmd "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"
          --health-interval 5s --health-timeout 10s --health-retries 12
    env:
      FLEET_TEST_KAFKA: 127.0.0.1:9092
      FLEET_TEST_POSTGRES: Host=localhost;Port=5432;Database=fleetflow_hardening_ci;Username=postgres;Password=foundation_ci_only
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v5

      - name: Setup .NET SDK 10.0
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet Packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore Backend Dependencies
        run: dotnet restore FleetFlow.sln

      - name: Run Backend Tests with TRX Logger
        run: |
          mkdir -p TestResults
          dotnet test FleetFlow.sln --configuration Release --logger "trx" --results-directory ./TestResults

      - name: Upload Test Results Report (TRX)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: backend-test-results
          path: ./TestResults
          retention-days: 14

  # =========================================================================
  # STAGE 3: FRONTEND LINT
  # Enforces static code quality and syntax rules
  # =========================================================================
  frontend-lint:
    name: "Frontend : Lint & Code Quality"
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v5

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v5
        with:
          node-version: '22.x'
          cache: 'npm'
          cache-dependency-path: 'src/frontend/package-lock.json'

      - name: Install Frontend Dependencies
        working-directory: src/frontend
        run: npm ci

      - name: Execute ESLint
        working-directory: src/frontend
        run: npm run lint

  # =========================================================================
  # STAGE 4: FRONTEND TEST
  # Runs client test suite (Node test runner + jsdom)
  # =========================================================================
  frontend-test:
    name: "Frontend : Automated Tests"
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v5

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v5
        with:
          node-version: '22.x'
          cache: 'npm'
          cache-dependency-path: 'src/frontend/package-lock.json'

      - name: Install Frontend Dependencies
        working-directory: src/frontend
        run: npm ci

      - name: Run Frontend Tests
        working-directory: src/frontend
        run: npm test

  # =========================================================================
  # STAGE 5: FRONTEND BUILD
  # Generates production bundle with Vite, depends on lint & test passes
  # =========================================================================
  frontend-build:
    name: "Frontend : Production Build"
    runs-on: ubuntu-24.04
    needs: [frontend-lint, frontend-test]
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v5

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v5
        with:
          node-version: '22.x'
          cache: 'npm'
          cache-dependency-path: 'src/frontend/package-lock.json'

      - name: Install Frontend Dependencies
        working-directory: src/frontend
        run: npm ci

      - name: Build Vite Production Assets
        working-directory: src/frontend
        run: npm run build

      - name: Enforce Entry JavaScript Budget
        run: node tools/Check-FrontendBundle.mjs --output artifacts/frontend-bundle-budget.json

      - name: Upload Frontend Bundle Evidence
        uses: actions/upload-artifact@v6
        with:
          name: frontend-bundle-budget
          path: artifacts/frontend-bundle-budget.json
          retention-days: 14

      - name: Upload Frontend Production Artifact
        uses: actions/upload-artifact@v6
        with:
          name: frontend-dist
          path: src/frontend/dist
          retention-days: 7

  # =========================================================================
  # STAGE 6: CI QUALITY GATE / VERIFICATION
  # Aggregates build & test status from backend and frontend stages
  # =========================================================================
  ci-quality-gate:
    name: "CI : Quality Gate Validation"
    runs-on: ubuntu-24.04
    needs: [backend-build, backend-test, frontend-lint, frontend-test, frontend-build]
    steps:
      - name: Verification Summary
        run: |
          echo "========================================================"
          echo " ALL QUALITY GATES PASSED SUCCESSFULLY!"
          echo " - Backend Build & Publish    : SUCCESS"
          echo " - Backend Unit Tests (xUnit) : SUCCESS"
          echo " - Frontend Lint (ESLint)     : SUCCESS"
          echo " - Frontend Tests (Node test) : SUCCESS"
          echo " - Frontend Production Build  : SUCCESS"
          echo " Pipeline is ready for deployment / merge."
          echo "========================================================"
