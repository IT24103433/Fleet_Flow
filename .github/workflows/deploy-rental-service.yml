name: Deploy RentalService to Azure App Service

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}

jobs:
  # =========================================================================
  # STAGE 1: BUILD & PACKAGE
  # Compiles and publishes self-contained Linux binary
  # =========================================================================
  build:
    name: "RentalService : Build & Package"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore src/backend/services/RentalService/RentalService.Api/RentalService.Api.csproj -r linux-x64

      - name: Build
        run: dotnet build src/backend/services/RentalService/RentalService.Api/RentalService.Api.csproj --configuration Release -r linux-x64 --no-restore

      - name: Publish self-contained binary
        run: dotnet publish src/backend/services/RentalService/RentalService.Api/RentalService.Api.csproj --configuration Release -r linux-x64 --self-contained true --output ./publish/rental-app

      - name: Ensure Linux execution permissions
        run: chmod +x ./publish/rental-app/RentalService.Api

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: rental-service-app
          path: ./publish/rental-app
          retention-days: 7

  # =========================================================================
  # STAGE 2: DEPLOY TO AZURE & SMOKE TEST
  # Isolated deployment stage using the verified build package with OIDC & smoke probe
  # =========================================================================
  deploy:
    name: "RentalService : Deploy to Azure"
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: rental-service-app
          path: ./rental-app

      - name: Ensure executable permission after artifact download
        run: chmod +x ./rental-app/RentalService.Api

      - name: Azure Login via OIDC
        if: env.AZURE_CLIENT_ID != ''
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_RENTAL_SERVICE_APP_NAME }}
          publish-profile: ${{ secrets.AZURE_RENTAL_SERVICE_PUBLISH_PROFILE }}
          package: ./rental-app

      - name: Post-Deployment Smoke Probing
        run: |
          APP_NAME="${{ secrets.AZURE_RENTAL_SERVICE_APP_NAME }}"
          PROBE_URL="https://${APP_NAME}.azurewebsites.net/health/ready"
          echo "Verifying RentalService readiness at $PROBE_URL..."
          for i in {1..15}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$PROBE_URL" || true)
            if [ "$STATUS" = "200" ]; then
              echo "RentalService is healthy and ready (HTTP 200)!"
              exit 0
            fi
            echo "Attempt $i: Received HTTP $STATUS, retrying in 5s..."
            sleep 5
          done
          echo "RentalService readiness probe timed out after 75s. Check application logs."
          exit 1
        shell: bash
