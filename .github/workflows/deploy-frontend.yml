name: Deploy Frontend to Azure App Service

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  # =========================================================================
  # STAGE 1: BUILD & PACKAGE
  # Installs dependencies, compiles Vite React client, prepares server bundle
  # =========================================================================
  build:
    name: "Frontend : Build & Package"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'
          cache-dependency-path: 'src/frontend/package-lock.json'

      - name: Install dependencies
        run: npm ci
        working-directory: src/frontend

      - name: Build React App
        run: npm run build
        working-directory: src/frontend

      - name: Prepare Server Files
        run: |
          cp server.js dist/server.js
          cp package.deploy.json dist/package.json
        working-directory: src/frontend

      - name: Upload frontend deployment package
        uses: actions/upload-artifact@v4
        with:
          name: frontend-deploy-package
          path: src/frontend/dist
          retention-days: 7

  # =========================================================================
  # STAGE 2: DEPLOY TO AZURE
  # Isolated deployment stage using the verified production package
  # =========================================================================
  deploy:
    name: "Frontend : Deploy to Azure"
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download frontend package
        uses: actions/download-artifact@v4
        with:
          name: frontend-deploy-package
          path: ./dist

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_FRONTEND_APP_NAME }}
          publish-profile: ${{ secrets.AZURE_FRONTEND_PUBLISH_PROFILE }}
          package: ./dist
