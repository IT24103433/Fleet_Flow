name: Deploy Frontend to Azure App Service

# Sprint 4 requires a coordinated four-service release; a main merge must not
# automatically deploy only the legacy Identity/Fleet/frontend applications.
on:
  workflow_dispatch:

jobs:
  # =========================================================================
  # STAGE 1: BUILD & PACKAGE
  # Installs dependencies, compiles Vite React client, prepares server bundle
  # =========================================================================
  build:
    name: "Frontend : Build & Package"
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22.x'
          cache: 'npm'
          cache-dependency-path: 'src/frontend/package-lock.json'

      - name: Install dependencies
        run: npm ci
        working-directory: src/frontend

      - name: Build React App
        run: npm run build
        working-directory: src/frontend
        env:
          VITE_IDENTITY_API_URL: ${{ vars.VITE_IDENTITY_API_URL || 'https://fleetflow-identity-api.azurewebsites.net' }}
          VITE_FLEET_API_URL: ${{ vars.VITE_FLEET_API_URL || 'https://fleetflow-fleet-api.azurewebsites.net' }}
          VITE_RENTAL_API_URL: ${{ vars.VITE_RENTAL_API_URL || 'https://fleetflow-rental-api.azurewebsites.net' }}
          VITE_NOTIFICATION_API_URL: ${{ vars.VITE_NOTIFICATION_API_URL || 'https://fleetflow-notification-api.azurewebsites.net' }}

      - name: Prepare Server Files
        run: |
          cp server.js dist/server.js
          cp package.deploy.json dist/package.json
        working-directory: src/frontend

      - name: Upload frontend deployment package
        uses: actions/upload-artifact@v6
        with:
          name: frontend-deploy-package
          path: src/frontend/dist
          retention-days: 7

  # =========================================================================
  # STAGE 2: DEPLOY TO AZURE
  # Isolated deployment stage using the verified production package
  # =========================================================================
  deploy:
    name: "Frontend : Deploy to Azure"
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Download frontend package
        uses: actions/download-artifact@v7
        with:
          name: frontend-deploy-package
          path: ./dist

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_FRONTEND_APP_NAME }}
          publish-profile: ${{ secrets.AZURE_FRONTEND_PUBLISH_PROFILE }}
          package: ./dist
