name: Deploy Frontend to Azure App Service

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}

jobs:
  # =========================================================================
  # STAGE 1: BUILD & PACKAGE
  # Installs dependencies, compiles Vite React client, prepares server bundle
  # =========================================================================
  build:
    name: "Frontend : Build & Package"
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22.x'
          cache: 'npm'
          cache-dependency-path: 'src/frontend/package-lock.json'

      - name: Install dependencies
        run: npm ci
        working-directory: src/frontend

      - name: Build React App
        run: |
          if [ -n "${{ secrets.AZURE_IDENTITY_SERVICE_APP_NAME }}" ]; then export VITE_IDENTITY_API_URL="https://${{ secrets.AZURE_IDENTITY_SERVICE_APP_NAME }}.azurewebsites.net"; fi
          if [ -n "${{ secrets.AZURE_FLEET_SERVICE_APP_NAME }}" ]; then export VITE_FLEET_API_URL="https://${{ secrets.AZURE_FLEET_SERVICE_APP_NAME }}.azurewebsites.net"; fi
          if [ -n "${{ secrets.AZURE_RENTAL_SERVICE_APP_NAME }}" ]; then export VITE_RENTAL_API_URL="https://${{ secrets.AZURE_RENTAL_SERVICE_APP_NAME }}.azurewebsites.net"; fi
          if [ -n "${{ secrets.AZURE_NOTIFICATION_SERVICE_APP_NAME }}" ]; then export VITE_NOTIFICATION_API_URL="https://${{ secrets.AZURE_NOTIFICATION_SERVICE_APP_NAME }}.azurewebsites.net"; fi
          npm run build
        working-directory: src/frontend
        env:
          VITE_IDENTITY_API_URL: ${{ vars.VITE_IDENTITY_API_URL || 'https://fleetflow-identity-api.azurewebsites.net' }}
          VITE_FLEET_API_URL: ${{ vars.VITE_FLEET_API_URL || 'https://fleetflow-fleet-api.azurewebsites.net' }}
          VITE_RENTAL_API_URL: ${{ vars.VITE_RENTAL_API_URL || 'https://fleetflow-rental-api.azurewebsites.net' }}
          VITE_NOTIFICATION_API_URL: ${{ vars.VITE_NOTIFICATION_API_URL || 'https://fleetflow-notification-api.azurewebsites.net' }}

      - name: Prepare Server Files
        run: |
          cp server.js dist/server.js
          cp package.deploy.json dist/package.json
        working-directory: src/frontend

      - name: Upload frontend deployment package
        uses: actions/upload-artifact@v6
        with:
          name: frontend-deploy-package
          path: src/frontend/dist
          retention-days: 7

  # =========================================================================
  # STAGE 2: DEPLOY TO AZURE & SMOKE TEST
  # Isolated deployment stage using verified production package with OIDC & smoke probe
  # =========================================================================
  deploy:
    name: "Frontend : Deploy to Azure"
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Download frontend package
        uses: actions/download-artifact@v7
        with:
          name: frontend-deploy-package
          path: ./dist

      - name: Azure Login via OIDC
        if: env.AZURE_CLIENT_ID != ''
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_FRONTEND_APP_NAME }}
          publish-profile: ${{ secrets.AZURE_FRONTEND_PUBLISH_PROFILE }}
          package: ./dist

      - name: Post-Deployment Smoke Probing
        run: |
          APP_NAME="${{ secrets.AZURE_FRONTEND_APP_NAME }}"
          PROBE_URL="https://${APP_NAME}.azurewebsites.net"
          echo "Verifying Frontend responsiveness at $PROBE_URL..."
          for i in {1..25}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$PROBE_URL" || true)
            if [ "$STATUS" = "200" ]; then
              echo "Frontend is online and serving traffic (HTTP 200)!"
              exit 0
            fi
            echo "Attempt $i: Received HTTP $STATUS, retrying in 5s..."
            sleep 5
          done
          echo "Frontend health probe timed out after 125s. Check application logs."
          exit 1
        shell: bash
