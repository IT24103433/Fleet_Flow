name: Deploy NotificationService to Azure App Service

# Sprint 4 requires a coordinated four-service release; a main merge must not
# automatically deploy only the legacy Identity/Fleet/frontend applications.
on:
  workflow_dispatch:

jobs:
  # =========================================================================
  # STAGE 1: BUILD & PACKAGE
  # Compiles and publishes self-contained Linux binary
  # =========================================================================
  build:
    name: "NotificationService : Build & Package"
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore src/backend/services/NotificationService/NotificationService.Api/NotificationService.Api.csproj -r linux-x64

      - name: Build
        run: dotnet build src/backend/services/NotificationService/NotificationService.Api/NotificationService.Api.csproj --configuration Release -r linux-x64 --no-restore

      - name: Publish self-contained binary
        run: dotnet publish src/backend/services/NotificationService/NotificationService.Api/NotificationService.Api.csproj --configuration Release -r linux-x64 --self-contained true --output ./publish/notification-app

      - name: Ensure Linux execution permissions
        run: chmod +x ./publish/notification-app/NotificationService.Api

      - name: Upload build artifact
        uses: actions/upload-artifact@v6
        with:
          name: notification-service-app
          path: ./publish/notification-app
          retention-days: 7

  # =========================================================================
  # STAGE 2: DEPLOY TO AZURE
  # Isolated deployment stage using the verified build package
  # =========================================================================
  deploy:
    name: "NotificationService : Deploy to Azure"
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v7
        with:
          name: notification-service-app
          path: ./notification-app

      - name: Ensure executable permission after artifact download
        run: chmod +x ./notification-app/NotificationService.Api

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_NOTIFICATION_SERVICE_APP_NAME }}
          publish-profile: ${{ secrets.AZURE_NOTIFICATION_SERVICE_PUBLISH_PROFILE }}
          package: ./notification-app
