name: Deploy FleetService to Azure App Service

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  # =========================================================================
  # STAGE 1: BUILD & PACKAGE
  # Compiles and publishes self-contained Linux binary
  # =========================================================================
  build:
    name: "FleetService : Build & Package"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore src/backend/services/FleetService/FleetService.Api/FleetService.Api.csproj -r linux-x64

      - name: Build
        run: dotnet build src/backend/services/FleetService/FleetService.Api/FleetService.Api.csproj --configuration Release -r linux-x64 --no-restore

      - name: Publish self-contained binary
        run: dotnet publish src/backend/services/FleetService/FleetService.Api/FleetService.Api.csproj --configuration Release -r linux-x64 --self-contained true --output ./publish/fleet-app

      - name: Ensure Linux execution permissions
        run: chmod +x ./publish/fleet-app/FleetService.Api

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: fleet-service-app
          path: ./publish/fleet-app
          retention-days: 7

  # =========================================================================
  # STAGE 2: DEPLOY TO AZURE
  # Isolated deployment stage using the verified build package
  # =========================================================================
  deploy:
    name: "FleetService : Deploy to Azure"
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: fleet-service-app
          path: ./fleet-app

      - name: Ensure executable permission after artifact download
        run: chmod +x ./fleet-app/FleetService.Api

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_FLEET_SERVICE_APP_NAME }}
          publish-profile: ${{ secrets.AZURE_FLEET_SERVICE_PUBLISH_PROFILE }}
          package: ./fleet-app
